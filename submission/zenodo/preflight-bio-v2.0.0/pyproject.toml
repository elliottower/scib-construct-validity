[project]
name = "preflight-bio"
version = "0.1.0"
description = "Transportability diagnostics for foundation models in biology"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "anndata>=0.10",
]

[project.optional-dependencies]
scfm = [
    "transformers>=4.30",
    "scanpy>=1.9",
]
census = [
    "cellxgene-census>=1.0",
]
curvature = [
    "networkx>=3.0",
    "POT>=0.9",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.0",
    "networkx>=3.0",
    "POT>=0.9",
    "pandas>=2.0",
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.scripts]
preflight = "preflight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
